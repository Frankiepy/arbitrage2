{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Arbitrage Betting Options</title>
</head>
<body>
    <h1>Arbitrage Betting Options</h1>
    <h3><a href = 'https://the-odds-api.com/#get-access'>get a free api key from here to use the site</a></h3>
    <b>Type in a API key to show current betting options</b>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="key" value="">
        <button type="submit">Click me!</button>
    </form>
    {% for line in count %}
    {% for l in line %}
    <p>{{ l }}</p>
    {% endfor %}
    <p>.</p>
    {% endfor %}
</body>
</html>
